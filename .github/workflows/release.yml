# Gera o instalador do Windows (.exe) e publica na aba "Releases" do GitHub.
# Dispara quando uma tag "v*" é enviada (ex.: v0.1.0) ou manualmente pela aba Actions.
name: Build e Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      notas:
        description: "Novidades desta versão (aparecem na faixa de atualização do app)"
        required: false
        default: "Melhorias e correções."

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependências
        run: npm ci

      - name: Compilar e publicar instalador
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Chave que assina as atualizações (segredo do repositório; sem senha)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "AION2 Task Manager v__VERSION__"
          # Texto exibido na faixa "Nova versão disponível" dentro do app
          releaseBody: ${{ inputs.notas || 'Melhorias e correções.' }}
          releaseDraft: false
          prerelease: false
